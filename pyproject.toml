[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-prime-agent"
version = "0.2.0"
description = "Prime Agent-style runtime for integrating patient data into a validated digital twin report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Local open-source model support (Hugging Face transformers, no Ollama).
llm = [
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.30",
    "sentencepiece>=0.2",
    "psutil>=5.9",
]
# 4-bit quantization; only usable on CUDA machines.
quant = [
    "bitsandbytes>=0.43; platform_system != 'Darwin'",
]
# GGUF-quantized local model support for the DDI Evidence/Finding Agent
# (path_d/ddi/finding_agent.py) -- a precompiled, CPU-only llama.cpp-based runner.
# This is the path that actually works on this project's reference CPU-only, no-CUDA
# hardware: the `llm`/`quant` groups above load full float32 (or CUDA-only 4-bit) weights,
# which real measurement showed does not reliably fit in ~7.69 GB RAM even for a 0.5B
# model; a GGUF file is quantized on disk, so gpt4all never materializes a float32 copy in
# memory. `llama-cpp-python` was tried first and could not even be installed here (no
# prebuilt wheel for this Python version, no C/C++ toolchain to build one) -- gpt4all
# ships a precompiled native binary instead, no build step needed.
gguf = [
    "gpt4all>=2.8",
]
# Hosted-model backend for the DDI Evidence/Finding Agent
# (PRIME_AGENT_LLM_PROVIDER=openai; key read from OPENAI_API_KEY, never hardcoded).
api = [
    "openai>=1.40",
]
test = [
    "pytest>=8.0",
]

[project.scripts]
prime-patient-agent = "patient_prime_agent.cli:main"
prime-agent = "patient_prime_agent.agentic.cli:main"

[tool.setuptools]
packages = [
    "patient_prime_agent",
    "patient_prime_agent.core",
    "patient_prime_agent.path_a",
    "patient_prime_agent.path_a.extractors",
    "patient_prime_agent.path_d",
    "patient_prime_agent.path_d.ddi",
    "patient_prime_agent.validation",
    "patient_prime_agent.agentic",
    "patient_prime_agent.external_lookup",
]

[tool.setuptools.package-data]
patient_prime_agent = ["path_a/skills/**/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep temp projects inside the repo: the system temp dir is not always writable
# on locked-down Windows profiles.
# -m "not slow": excludes real-network/live-API tests (see the "slow" marker below)
# from the default run -- they depend on live third-party conditions (e.g. whether
# NCBI actually rate-limits a given burst today) and are not deterministic enough
# for every commit. Run them explicitly with `pytest -m slow ...`.
addopts = "-q -p no:cacheprovider --basetemp=.pytest-tmp -m \"not slow\""
markers = [
    "slow: real network calls to a live third-party API; excluded by default (see addopts), run manually or nightly with `pytest -m slow`",
]
